name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'packages/cms/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

concurrency:
  group: sanity-studio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy editorial Studio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard production branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error title=Studio deployment blocked::Production deployments must run from main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Studio
        run: npm run build --workspace=apps/studio
        env:
          SANITY_STUDIO_PROJECT_ID: l71yzb5e
          SANITY_STUDIO_DATASET: production

      - name: Detect optional Studio deployment credential
        id: studio_deploy
        shell: bash
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [[ -n "$SANITY_AUTH_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hosted Studio publish skipped::SANITY_AUTH_TOKEN is not configured; the Studio build succeeded."
          fi

      - name: Deploy hosted Studio
        if: steps.studio_deploy.outputs.available == 'true'
        run: npm exec --workspace=apps/studio -- sanity deploy --yes
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: l71yzb5e
          SANITY_STUDIO_DATASET: production
